{# web/templates/components/school/class_watch_toggle.html #}
{% from "components/ui/icon.html" import icon %}

<span
  id="class-watch-toggle"
  class="class-watch-toggle"
>
  {% if is_whole_class_watched %}
  <button
    type="button"
    class="class-watch-toggle__button class-watch-toggle__button--active"
    hx-post="/school/class/{{ watch_class_id }}/watch/delete"
    hx-target="#class-watch-toggle"
    hx-swap="outerHTML"
    hx-indicator="#class-watch-toggle"
    hx-confirm="Удалить класс из отслеживаемых?"
    hx-disabled-elt="this"
    aria-label="Удалить класс из отслеживаемых"
    aria-pressed="true"
    title="Убрать из отслеживаемых классов"
  >
    {{ icon("star-duotone", class="icon-primary") }}
  </button>
  {% else %}
  <button
    type="button"
    class="class-watch-toggle__button"
    hx-post="/school/class/{{ watch_class_id }}/watch"
    hx-target="#class-watch-toggle"
    hx-swap="outerHTML"
    hx-indicator="#class-watch-toggle"
    hx-disabled-elt="this"
    aria-label="Добавить класс в отслеживаемые"
    aria-pressed="false"
    title="Добавить в отслеживаемые классы"
  >
    {{ icon("star-duotone", class="icon-muted") }}
  </button>
  {% endif %}

  {% if class_watch_error %}
  <span
    class="class-watch-toggle__error"
    role="alert"
  >
    {{ icon("warning-duotone") }} {{ class_watch_error }}
  </span>
  {% endif %}
</span>
