<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a56db">
  <title>Расписание</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/css/app.css?v=12">
  <style>
    .tg-bootstrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }
    .tg-bootstrap__title { font-size: 1.25rem; font-weight: bold; }
    .tg-bootstrap__hint { opacity: 0.7; font-size: 0.9rem; word-break: break-word; color: #e53e3e; }
  </style>
</head>
<body>
  <div class="tg-bootstrap">
    <div id="tg-title" class="tg-bootstrap__title">Открываем расписание…</div>
    <div id="tg-desc" class="tg-bootstrap__hint" style="color: inherit;">Инициализация...</div>
  </div>

  <!-- ВАЖНО: Скрипт подключается из файла, чтобы обойти блокировку CSP -->
  <script src="/static/js/tg-app.js?v=12"></script>

</html>
