<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a56db">
  <title>Соединение...</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f9fafb; color: #111827; text-align: center; margin:0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 80%; max-width: 350px; }
    h2 { margin-top: 0; color: #1a56db; margin-bottom: 8px; }
    p { color: #6b7280; margin-bottom: 24px; }
    .spinner { margin: 0 auto 20px; width: 40px; height: 40px; border: 4px solid #f3f4f6; border-top-color: #1a56db; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h2 id="title">Обновление...</h2>
    <p id="msg">Ожидаем ответа от сервера</p>
  </div>
  <script>
    function pingServer() {
      // Добавляем timestamp, чтобы запрос не застрял в кэше Safari
      fetch('/?ping=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
        .then(function(res) {
          // Если статус < 500, значит Nginx больше не отдает 502, сервер бота поднялся!
          if (res.status < 500) {
            document.getElementById('title').innerText = "Готово!";
            document.getElementById('msg').innerText = "Загружаем расписание...";
            setTimeout(function() { window.location.reload(); }, 500);
          } else {
            setTimeout(pingServer, 2000);
          }
        })
        .catch(function() {
          // Нет интернета
          document.getElementById('title').innerText = "Нет сети";
          document.getElementById('msg').innerText = "Проверьте подключение к интернету";
          setTimeout(pingServer, 2000);
        });
    }
    // Начинаем проверку через 2 секунды
    setTimeout(pingServer, 2000);
  </script>
</body>
</html>
