<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a56db">
  <title>Нет соединения — Школьное расписание</title>
  <style>
    :root { color-scheme: light; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#f3f4f6; color:#111827; }
    main { max-width:360px; text-align:center; background:#fff; padding:28px 20px;
      border-radius:16px; box-shadow:0 2px 10px #0001; }
    h1 { font-size:20px; margin:0 0 12px; } p { line-height:1.5; color:#4b5563; }
    button { min-height:44px; padding:8px 16px; border:0; border-radius:10px;
      background:#1a56db; color:#fff; font-size:16px; }
  </style>
</head>
<body>
  <main>
    <h1>📅 Нет соединения</h1>
    <p>Интерфейс приложения доступен, но персональное расписание не сохранено на устройстве из соображений безопасности.</p>
    <p>Подключитесь к сети и обновите страницу.</p>
    <button type="button" onclick="location.reload()">Обновить</button>
  </main>
</body>
</html>
